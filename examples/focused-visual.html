<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Keep the explanation in focus</title>
<style>
:root{font:17px/1.65 system-ui;color:#233044;background:#f5f6f8}*{box-sizing:border-box}body{margin:0;padding:clamp(20px,5vw,64px)}main{max-width:720px;margin:auto;background:white;border:1px solid #dce2e8;border-radius:12px;padding:clamp(24px,5vw,48px)}h1{font-size:clamp(28px,5vw,40px);line-height:1.2;letter-spacing:-.03em;margin:0 0 20px}p{margin:0 0 24px;color:#536176}label{display:block;font-weight:600;margin:24px 0 10px}input{width:100%;accent-color:#275dab}output{font-variant-numeric:tabular-nums}.bars{display:flex;border-radius:8px;overflow:hidden;min-height:76px;margin:24px 0}.content{background:#275dab;color:white;display:grid;place-items:center;width:75%;min-width:0}.layout{background:#e4ebf5;color:#334e75;display:grid;place-items:center;flex:1;min-width:0}.bars span{padding:10px;font-size:14px;text-align:center}small{display:block;color:#596574}input:focus-visible{outline:3px solid #275dab;outline-offset:5px}@media(prefers-color-scheme:dark){:root{background:#15191f;color:#e6eaf0}main{background:#1c222a;border-color:#39424e}p,small{color:#acb6c4}.layout{background:#394b63;color:#e6eaf0}}
</style>
</head>
<body><main>
<h1>Keep the explanation in focus</h1>
<p>The page should support the idea, not compete with it. This small example shows a custom interaction without a whole application.</p>
<label for="balance">Time spent on content: <output id="value" for="balance">75%</output></label>
<input id="balance" type="range" min="25" max="90" value="75">
<div class="bars" aria-hidden="true"><div class="content" id="content"><span>Content</span></div><div class="layout"><span>Layout</span></div></div>
<small>This is an illustration, not a measured result. The shared document template handles the routine layout work.</small>
</main><script>
const slider=document.getElementById('balance');
slider.addEventListener('input',()=>{document.getElementById('value').textContent=slider.value+'%';document.getElementById('content').style.width=slider.value+'%';});
</script></body></html>
