services:
  artifacts:
    build: .
    expose:
      - "3000"
    volumes:
      - artifacts-data:/app/data
    environment:
      - ARTIFACTS_URL=https://artifacts.yeeted.lol
      - PORT=3000
    networks:
      - default
    restart: unless-stopped

volumes:
  artifacts-data:

networks:
  default:
    external: true
    name: dokploy-network
